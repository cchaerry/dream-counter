
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dream Counter</title>

<style>
/* 전체 화면 */
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffe6f2, #fff0f7);
    font-family: "Pretendard", sans-serif;
}

/* 카드 */
.container {
    width: 90%;
    max-width: 500px;
    background: white;
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    position: relative;
    overflow: hidden;
}


}

h1 {
    color: #ff69b4;
}

input {
    width: 90%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 10px;
    border: 1px solid #ddd;
    font-size: 15px;
}

.counter {
    font-size: 60px;
    font-weight: bold;
    color: #ff69b4;
    margin: 20px 0;
    transition: transform 0.2s;
}

/* 진행률 바 */
.progress-container {
    width: 100%;
    height: 22px;
    background: #f0f0f0;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 15px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(to right, #ff9ad5, #ff69b4);
    transition: width 0.5s;
}

button {
    padding: 12px 20px;
    margin: 10px 5px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    transition: 0.2s;
}

.complete-btn {
    background: #ff69b4;
    color: white;
}

.reset-btn {
    background: #ddd;
}

button:hover {
    transform: scale(1.05);
}

.message {
    margin-top: 15px;
    font-weight: bold;
    color: #ff69b4;
}

.record {
    margin-top: 10px;
    color: #666;
}

/* 축하 애니메이션 */
.celebrate {
    animation: pop 0.5s;
}

@keyframes pop {
    0% {transform: scale(1);}
    50% {transform: scale(1.2);}
    100% {transform: scale(1);}
}

/* 반응형 */
@media(max-width:600px){
    .counter{
        font-size:45px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>🌟 Dream Counter 🌟</h1>

    <input type="text" id="goalName" placeholder="목표 입력 (예: 문제 풀기)">
    <input type="number" id="goalTarget" placeholder="목표 횟수 입력 (예: 30)">

    <div class="counter" id="count">0</div>

    <button class="complete-btn" onclick="increaseCount()">완료!</button>
    <button class="reset-btn" onclick="resetData()">초기화</button>

    <div class="record">
        최고 기록 : <span id="bestRecord">0</span>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <p id="progressText">0%</p>

    <div class="message" id="message">
        오늘도 화이팅! 💪
    </div>

</div>

<script>

/* localStorage에서 데이터 불러오기 */
let count = Number(localStorage.getItem("count")) || 0;
let best = Number(localStorage.getItem("best")) || 0;

document.getElementById("count").textContent = count;
document.getElementById("bestRecord").textContent = best;

/* 완료 버튼 */
function increaseCount(){

    count++;

    if(count > best){
        best = count;
    }

    saveData();

    updateUI();

    sparkleEffect();
}

/* 화면 업데이트 */
function updateUI(){

    document.getElementById("count").textContent = count;
    document.getElementById("bestRecord").textContent = best;

    const target =
        Number(document.getElementById("goalTarget").value) || 100;

    let percent = Math.min((count/target)*100,100);

    document.getElementById("progressBar").style.width =
        percent + "%";

    document.getElementById("progressText").textContent =
        percent.toFixed(0) + "%";

    let message = "오늘도 화이팅! 💪";

    if(count >= 50){
        message = "🎉 어느새 50번 달성!!";
    }
    else if(count >= 30){
        message = "🌟 목표에 가까워지고 있어요!";
    }
    else if(count >= 15){
        message = "✨ 습관이 만들어지고 있어요!";
    }
    else if(count >= 5){
        message = "👍 좋아! 꾸준히 하고 있어요!";
    }

    document.getElementById("message").textContent = message;

    if(count === target){
        document.querySelector(".container")
            .classList.add("celebrate");

        setTimeout(()=>{
            document.querySelector(".container")
                .classList.remove("celebrate");
        },500);

        alert("🎉 목표 달성 축하합니다!");
    }
}

/* 저장 */
function saveData(){
    localStorage.setItem("count", count);
    localStorage.setItem("best", best);
}

/* 초기화 */
function resetData(){

    if(confirm("기록을 초기화할까요?")){

        count = 0;

        localStorage.setItem("count",0);

        updateUI();
    }
}

/* 반짝이 효과 */
function sparkleEffect(){

    const sparkle = document.createElement("div");

    sparkle.innerHTML = "✨";

    sparkle.style.position = "fixed";
    sparkle.style.left =
        Math.random()*window.innerWidth + "px";

    sparkle.style.top =
        Math.random()*window.innerHeight + "px";

    sparkle.style.fontSize = "25px";

    sparkle.style.pointerEvents = "none";

    document.body.appendChild(sparkle);

    setTimeout(()=>{
        sparkle.remove();
    },1000);
}

/* 첫 실행 */
updateUI();

</script>

</body>
</html>
